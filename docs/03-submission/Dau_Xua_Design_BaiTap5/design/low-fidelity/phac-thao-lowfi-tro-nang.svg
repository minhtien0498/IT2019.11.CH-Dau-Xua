<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400">

    <style>
      .sheet{fill:#faf9f6}.phone{fill:#fff;stroke:#202124;stroke-width:2.2}.box{fill:#fff;stroke:#4a4a4a;stroke-width:1.4}.image{fill:#e5e5e5;stroke:#4a4a4a;stroke-width:1.4}.input{fill:#fafafa;stroke:#4a4a4a;stroke-width:1.4}.sketch-button{fill:#fff;stroke:#202124;stroke-width:1.6}.sketch-button-primary{fill:#dedede;stroke:#202124;stroke-width:2.2}.nav{fill:#f2f2f2;stroke:#777;stroke-width:1}.note{fill:#f6f6f6;stroke:#555;stroke-width:1.2}.dark{fill:#4a4a4a;stroke:#202124;stroke-width:1.4}.scan{fill:none;stroke:#fff;stroke-width:2.5}.selected{fill:#efefef;stroke:#202124;stroke-width:2}.toggle-on{fill:#202124;stroke:#202124;stroke-width:1}.toggle-off{fill:#fff;stroke:#202124;stroke-width:1}.progress{fill:#ddd;stroke:#777;stroke-width:1}.ink{fill:#202124}.line{stroke:#202124;stroke-width:1.4;fill:none}.soft-line{stroke:#a3a3a3;stroke-width:1.2;fill:none}.arrow{stroke:#555;stroke-width:2;fill:none;stroke-dasharray:7 6}.arrow-head{stroke:#555;stroke-width:2;fill:none}.dot{fill:#aaa}.ink-dot{fill:#202124}.appbar{font:700 11px Arial,sans-serif;letter-spacing:1.1px;fill:#202124}.screen-number{font:700 18px Arial,sans-serif;fill:#202124}.screen-title{font:700 16px Arial,sans-serif;fill:#202124}.heading{font:700 17px Arial,sans-serif;fill:#202124}.strong{font:700 12px Arial,sans-serif;fill:#202124}.text{font:12px Arial,sans-serif;fill:#202124}.muted{font:11px Arial,sans-serif;fill:#666}.button-text{font:700 11px Arial,sans-serif;fill:#202124}.caption{font:italic 11px Arial,sans-serif;fill:#555}.note-text{font:11px Arial,sans-serif;fill:#303030}.nav-text{font:8px Arial,sans-serif;fill:#404040}.player{font:700 14px Arial,sans-serif;fill:#202124}.completion{font:700 48px Arial,sans-serif;fill:#202124}.error-mark{font:700 42px Arial,sans-serif;fill:#202124}.tag{font:700 9px Arial,sans-serif;fill:#202124;letter-spacing:1px}
      .sheet-title{font:700 28px Arial,sans-serif;fill:#202124}.sheet-subtitle{font:14px Arial,sans-serif;fill:#606060}.legend{fill:#f0f0ee;stroke:#666;stroke-width:1}.legend-head{font:700 12px Arial,sans-serif;fill:#202124}.legend-text{font:11px Arial,sans-serif;fill:#303030}
    </style>
    
<rect class="sheet" x="0" y="0" width="1600" height="1400" rx="0"/>
<text class="sheet-title" x="80" y="58" text-anchor="start">Phác thảo low-fi 02 — Luồng trợ năng và phương án thay thế</text>
<text class="sheet-subtitle" x="80" y="86" text-anchor="start">Chuẩn bị cho Mục 2.5. Mỗi trạng thái có chữ, nhãn và hành động rõ ràng.</text>
<rect class="phone" x="125" y="145" width="270" height="520" rx="18"/><rect class="ink" x="230" y="153" width="60" height="5" rx="3"/><text class="screen-number" x="139" y="125" text-anchor="start">A1</text><text class="screen-title" x="170" y="125" text-anchor="start">Cài đặt trợ năng</text><text class="appbar" x="260.0" y="180" text-anchor="middle">DẤU XƯA</text><path class="soft-line" d="M139 194 L381 194"/><text class="caption" x="141" y="685" text-anchor="start">M5–M7: lựa chọn độc lập</text><text class="heading" x="143" y="229" text-anchor="start">Trải nghiệm theo</text><text class="heading" x="143" y="249" text-anchor="start">cách của bạn</text><rect class="box" x="143" y="297" width="234" height="48" rx="7"/><text class="strong" x="154" y="318" text-anchor="start">Mô tả bằng âm thanh</text><text class="muted" x="154" y="335" text-anchor="start">Bật</text><rect class="toggle-on" x="343" y="310" width="24" height="16" rx="8"/><rect class="box" x="143" y="357" width="234" height="48" rx="7"/><text class="strong" x="154" y="378" text-anchor="start">Tín hiệu rung</text><text class="muted" x="154" y="395" text-anchor="start">Tắt</text><rect class="toggle-off" x="343" y="370" width="24" height="16" rx="8"/><rect class="box" x="143" y="417" width="234" height="48" rx="7"/><text class="strong" x="154" y="438" text-anchor="start">Tăng tương phản</text><text class="muted" x="154" y="455" text-anchor="start">Bật</text><rect class="toggle-on" x="343" y="430" width="24" height="16" rx="8"/><rect class="box" x="143" y="477" width="234" height="48" rx="7"/><text class="strong" x="154" y="498" text-anchor="start">Giảm chuyển động</text><text class="muted" x="154" y="515" text-anchor="start">Tắt</text><rect class="toggle-off" x="343" y="490" width="24" height="16" rx="8"/><rect class="note" x="143" y="555" width="230" height="52" rx="8"/><text class="note-text" x="153" y="575" text-anchor="start">Không chỉ dùng màu, âm thanh</text><text class="note-text" x="153" y="590" text-anchor="start">hoặc rung để báo trạng thái.</text>
<rect class="phone" x="500" y="145" width="270" height="520" rx="18"/><rect class="ink" x="605" y="153" width="60" height="5" rx="3"/><text class="screen-number" x="514" y="125" text-anchor="start">A2</text><text class="screen-title" x="545" y="125" text-anchor="start">Danh sách đơn giản</text><text class="appbar" x="635.0" y="180" text-anchor="middle">DẤU XƯA</text><path class="soft-line" d="M514 194 L756 194"/><text class="caption" x="516" y="685" text-anchor="start">M6: thứ tự đọc và nhãn rõ</text><text class="heading" x="518" y="227" text-anchor="start">Hiện vật quanh bạn</text><text class="muted" x="518" y="255" text-anchor="start">3 kết quả</text><rect class="box" x="518" y="285" width="234" height="55" rx="7"/><text class="strong" x="530" y="307" text-anchor="start">1. Chiếc máy ảnh</text><text class="muted" x="530" y="325" text-anchor="start">Nút mở câu chuyện</text><rect class="box" x="518" y="353" width="234" height="55" rx="7"/><text class="strong" x="530" y="375" text-anchor="start">2. Âm vang trống đồng</text><text class="muted" x="530" y="393" text-anchor="start">Nút mở câu chuyện</text><rect class="box" x="518" y="421" width="234" height="55" rx="7"/><text class="strong" x="530" y="443" text-anchor="start">3. Lá thư chưa kịp gửi</text><text class="muted" x="530" y="461" text-anchor="start">Nút mở câu chuyện</text><rect class="note" x="518" y="515" width="230" height="52" rx="8"/><text class="note-text" x="528" y="535" text-anchor="start">Focus đọc theo thứ tự:</text><text class="note-text" x="528" y="550" text-anchor="start">tiêu đề → mô tả → mở.</text>
<rect class="phone" x="875" y="145" width="270" height="520" rx="18"/><rect class="ink" x="980" y="153" width="60" height="5" rx="3"/><text class="screen-number" x="889" y="125" text-anchor="start">A3</text><text class="screen-title" x="920" y="125" text-anchor="start">Camera không dùng được</text><text class="appbar" x="1010.0" y="180" text-anchor="middle">DẤU XƯA</text><path class="soft-line" d="M889 194 L1131 194"/><text class="caption" x="891" y="685" text-anchor="start">Khả năng chịu lỗi</text><text class="error-mark" x="1010.0" y="290" text-anchor="middle">!</text><text class="heading" x="893" y="335" text-anchor="start">Không thể dùng</text><text class="heading" x="893" y="355" text-anchor="start">camera trên thiết bị này</text><text class="muted" x="893" y="397" text-anchor="start">Bạn vẫn có thể mở câu chuyện</text><rect class="sketch-button" x="893" y="431" width="234" height="30" rx="6"/><text class="button-text" x="1010.0" y="451" text-anchor="middle">Nhập mã bằng tay</text><rect class="sketch-button-primary" x="893" y="473" width="234" height="30" rx="6"/><text class="button-text" x="1010.0" y="493" text-anchor="middle">Chọn từ danh sách</text><rect class="note" x="893" y="545" width="230" height="52" rx="8"/><text class="note-text" x="903" y="565" text-anchor="start">Thông báo bằng chữ và icon;</text><text class="note-text" x="903" y="580" text-anchor="start">không chỉ bằng màu đỏ.</text>
<rect class="phone" x="1250" y="145" width="270" height="520" rx="18"/><rect class="ink" x="1355" y="153" width="60" height="5" rx="3"/><text class="screen-number" x="1264" y="125" text-anchor="start">A4</text><text class="screen-title" x="1295" y="125" text-anchor="start">Player có mô tả</text><text class="appbar" x="1385.0" y="180" text-anchor="middle">DẤU XƯA</text><path class="soft-line" d="M1264 194 L1506 194"/><text class="caption" x="1266" y="685" text-anchor="start">Thông tin có thể cảm nhận</text><text class="heading" x="1268" y="230" text-anchor="start">Chiếc máy ảnh</text><rect class="note" x="1268" y="265" width="234" height="76" rx="7"/><text class="strong" x="1278" y="290" text-anchor="start">Mô tả hiện vật</text><text class="muted" x="1278" y="309" text-anchor="start">Máy ảnh thân kim loại,</text><text class="muted" x="1278" y="324" text-anchor="start">ống kính tròn, dây da.</text><rect class="box" x="1268" y="363" width="234" height="115" rx="8"/><text class="player" x="1385.0" y="408" text-anchor="middle">Lùi 15   Phát   Tới 15</text><text class="muted" x="1385.0" y="439" text-anchor="middle">Tiến độ 0:00 / 3:00</text><rect class="sketch-button" x="1268" y="510" width="234" height="30" rx="6"/><text class="button-text" x="1385.0" y="530" text-anchor="middle">Đọc bản chép lời</text><rect class="note" x="1268" y="555" width="230" height="52" rx="8"/><text class="note-text" x="1278" y="575" text-anchor="start">Nhãn điều khiển đủ nghĩa</text><text class="note-text" x="1278" y="590" text-anchor="start">cho VoiceOver/TalkBack.</text>
<rect class="legend" x="80" y="1280" width="1440" height="72" rx="10"/>
<text class="legend-head" x="102" y="1310" text-anchor="start">Ghi chú thiết kế:</text>
<text class="legend-text" x="255" y="1310" text-anchor="start">• Không chỉ dùng màu sắc, âm thanh hoặc rung</text>
<text class="legend-text" x="655" y="1310" text-anchor="start">• Có thứ tự đọc dự kiến cho trình đọc màn hình</text>
<text class="legend-text" x="1055" y="1310" text-anchor="start">• Camera lỗi vẫn mở được nội dung</text>
</svg>