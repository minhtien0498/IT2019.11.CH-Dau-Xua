<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Luồng tổng quan ứng dụng Dấu Xưa</title>
  <desc id="desc">Bản rút gọn gồm khởi động, khám phá miễn phí và tour.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3a2a25" flood-opacity=".09"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f6a65"/></marker>
    <style>
      text{font-family:Arial,"Noto Sans",sans-serif;fill:#1f2933}.title{font-size:26px;font-weight:700;fill:#542020}.subtitle{font-size:14px;fill:#59636e}.lane{fill:#fffdf8;stroke:#d1c9c0;stroke-width:1.5}.lane-head{fill:#f2ede7}.lane-title{font-size:14px;font-weight:700;fill:#542020}.box{fill:#fff;stroke:#a8a099;stroke-width:2;filter:url(#shadow)}.soft{fill:#f6f3ee}.main{fill:#7a2e2e;stroke:#542020;stroke-width:3;filter:url(#shadow)}.decision{fill:#efe7de;stroke:#7a2e2e;stroke-width:2;filter:url(#shadow)}.label{font-size:14px;font-weight:600;text-anchor:middle}.sub{font-size:12px;font-weight:400}.main-label{font-size:15px;font-weight:700;text-anchor:middle;fill:#fff}.flow{fill:none;stroke:#6f6a65;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}.edge-label{font-size:11px;font-weight:700;paint-order:stroke;stroke:#fffdf8;stroke-width:5px}
    </style>
  </defs>
  <rect width="1600" height="920" fill="#fffdf8"/>
  <text x="55" y="54" class="title">DẤU XƯA — LUỒNG TỔNG QUAN</text>
  <text x="55" y="82" class="subtitle">Các bước chính trong prototype 0.5.0 · Bản rút gọn</text>

  <g id="lanes">
    <rect class="lane" x="50" y="115" width="1500" height="170" rx="16"/><path class="lane-head" d="M66 115h1468a16 16 0 0 1 16 16v18H50v-18a16 16 0 0 1 16-16z"/><text x="70" y="138" class="lane-title">1  KHỞI ĐỘNG</text>
    <rect class="lane" x="50" y="310" width="1500" height="265" rx="16"/><path class="lane-head" d="M66 310h1468a16 16 0 0 1 16 16v18H50v-18a16 16 0 0 1 16-16z"/><text x="70" y="333" class="lane-title">2  KHÁM PHÁ MIỄN PHÍ</text>
    <rect class="lane" x="50" y="600" width="1500" height="205" rx="16"/><path class="lane-head" d="M66 600h1468a16 16 0 0 1 16 16v18H50v-18a16 16 0 0 1 16-16z"/><text x="70" y="623" class="lane-title">3  TOUR</text>
  </g>

  <g id="connectors">
    <path class="flow" d="M400 215H530M750 215H880M1110 215H1240"/>
    <path class="flow" d="M300 421H365M580 421H645M880 421H945M1150 421H1215"/>
    <path class="flow" d="M1270 467V481H1252V495M1330 467V481H1435V495"/>
    <text x="1237" y="486" class="edge-label">Có</text><text x="1370" y="486" class="edge-label">Không</text>
    <path class="flow" d="M240 706H285M460 706H505M670 706H715M880 706H925M1090 706H1135M1325 706H1370"/>
    <path class="flow dashed" d="M158 737V755"/>
  </g>

  <g id="startup">
    <rect class="box" x="180" y="180" width="220" height="70" rx="13"/><text x="290" y="210" class="label"><tspan x="290">Welcome</tspan><tspan x="290" dy="19" class="sub">ngôn ngữ · trợ năng</tspan></text>
    <rect class="box" x="530" y="180" width="220" height="70" rx="13"/><text x="640" y="220" class="label">Chọn địa điểm</text>
    <rect class="main" x="880" y="174" width="230" height="82" rx="14"/><text x="995" y="208" class="main-label"><tspan x="995">KHÁM PHÁ</tspan><tspan x="995" dy="21" class="sub" fill="#fff">trang trung tâm</tspan></text>
    <rect class="box soft" x="1240" y="180" width="220" height="70" rx="13"/><text x="1350" y="210" class="label"><tspan x="1350">Điều hướng đáy</tspan><tspan x="1350" dy="19" class="sub">Tour · Đã lưu · Cá nhân</tspan></text>
  </g>
  <g id="free-flow">
    <rect class="box" x="95" y="385" width="205" height="72" rx="13"/><text x="198" y="415" class="label"><tspan x="198">Mở hiện vật</tspan><tspan x="198" dy="19" class="sub">QR · danh sách · nổi bật</tspan></text>
    <rect class="main" x="365" y="380" width="215" height="82" rx="14"/><text x="472" y="414" class="main-label"><tspan x="472">STORY PLAYER</tspan><tspan x="472" dy="21" class="sub" fill="#fff">nghe · tua · tốc độ</tspan></text>
    <rect class="box" x="645" y="385" width="235" height="72" rx="13"/><text x="762" y="415" class="label"><tspan x="762">Nội dung chi tiết</tspan><tspan x="762" dy="19" class="sub">Story · Timeline · Transcript · Nguồn</tspan></text>
    <rect class="box" x="945" y="385" width="205" height="72" rx="13"/><text x="1048" y="426" class="label">Gợi ý điểm tiếp theo</text>
    <polygon class="decision" points="1290,375 1365,421 1290,467 1215,421"/><text x="1290" y="426" class="label">Nghe tiếp?</text>
    <rect class="box" x="1160" y="495" width="185" height="52" rx="11"/><text x="1252" y="526" class="label" font-size="13">Mở câu chuyện khác</text>
    <rect class="box soft" x="1360" y="495" width="150" height="52" rx="11"/><text x="1435" y="526" class="label" font-size="13">Về Khám phá</text>
  </g>
  <g id="tour-flow">
    <rect class="box" x="75" y="675" width="165" height="62" rx="12"/><text x="158" y="711" class="label" font-size="13">Danh sách Tour</text>
    <rect class="box" x="285" y="675" width="175" height="62" rx="12"/><text x="372" y="711" class="label" font-size="13">Xem trước Premium</text>
    <rect class="box" x="505" y="675" width="165" height="62" rx="12"/><text x="588" y="711" class="label" font-size="13">Xác nhận mua</text>
    <rect class="box" x="715" y="675" width="165" height="62" rx="12"/><text x="798" y="711" class="label" font-size="13">Tiến trình Tour</text>
    <rect class="box" x="925" y="675" width="165" height="62" rx="12"/><text x="1008" y="711" class="label" font-size="13">Điểm Premium</text>
    <rect class="box soft" x="1135" y="670" width="190" height="72" rx="12"/><text x="1230" y="699" class="label"><tspan x="1230">AR hoặc phương án</tspan><tspan x="1230" dy="18" class="sub">ảnh · audio · transcript</tspan></text>
    <rect class="main" x="1370" y="675" width="165" height="62" rx="12"/><text x="1452" y="711" class="main-label" font-size="14">HOÀN THÀNH TOUR</text>
    <rect class="box" x="75" y="755" width="240" height="36" rx="10" stroke-dasharray="7 5"/><text x="195" y="778" class="page-text" text-anchor="middle" font-size="12">Tour miễn phí: thêm vào hành trình</text>
  </g>
</svg>
